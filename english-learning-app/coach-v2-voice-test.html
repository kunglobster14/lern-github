<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Coach Voice Friend Test</title><style>
:root{--bg:#07111f;--panel:#11233d;--line:#28405f;--text:#fff;--muted:#9fb0c5;--accent:#6d28d9;--ok:#22c55e;--danger:#ef4444}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#050b14,#07111f 35%,#0a1729);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px 14px 36px}h1{margin:0 0 6px}.muted{color:var(--muted)}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.badge{border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px}.scenarios{display:flex;gap:8px;overflow:auto;margin:14px 0}.scenarios button,.btn{border:1px solid var(--line);background:#142943;color:#fff;border-radius:14px;padding:11px 14px;cursor:pointer}.scenarios button.active{outline:2px solid #8b5cf6}.panel{background:rgba(17,35,61,.95);border:1px solid var(--line);border-radius:22px;padding:18px}.voicebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:12px;background:#09182b;border:1px solid var(--line);border-radius:16px}.start{background:linear-gradient(135deg,#7c3aed,#4f46e5);border:0;color:#fff;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer}.start.live{background:linear-gradient(135deg,#b91c1c,#ef4444)}.state{font-size:13px;color:#cbd5e1}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#64748b;margin-right:7px}.dot.listen{background:#22c55e;box-shadow:0 0 14px #22c55e}.dot.speak{background:#38bdf8;box-shadow:0 0 14px #38bdf8}.dot.wait{background:#f59e0b;box-shadow:0 0 14px #f59e0b}.chat{display:flex;flex-direction:column;gap:12px;min-height:360px;max-height:58vh;overflow:auto;padding:4px}.bubble{max-width:82%;background:#152a46;border:1px solid var(--line);padding:13px 15px;border-radius:18px;line-height:1.45}.bubble.user{align-self:flex-end;background:linear-gradient(135deg,#6d28d9,#4f46e5)}.bubble small{display:block;color:#aab7c8;margin-top:7px}.meta{font-size:11px;color:#7dd3fc;margin-top:6px}.speakBtn{margin-top:8px;border:1px solid var(--line);background:#0b1a2d;color:#fff;border-radius:10px;padding:7px 10px;cursor:pointer}.composer{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin-top:14px}.composer input{min-width:0;background:#09182b;border:1px solid var(--line);border-radius:14px;color:#fff;padding:13px}.send{background:linear-gradient(135deg,#7c3aed,#4f46e5);border:0;color:#fff;border-radius:14px;padding:0 18px;font-weight:700}.mic{font-size:20px;min-width:52px}.hint{font-size:12px;color:var(--muted);margin-top:8px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:560px){.bubble{max-width:92%}.wrap{padding:12px 10px}.composer{grid-template-columns:auto 1fr auto}.send{padding:0 14px}}
</style></head><body><div class="wrap"><div class="top"><div><div class="muted">MY ENGLISH · VOICE TEST</div><h1>English Coach · Friend Mode</h1></div><span class="badge" id="status">READY</span></div><p class="muted">คุยเหมือนเพื่อน · ชวนคุยต่อเอง · กดเริ่มครั้งเดียวแล้วสนทนาด้วยเสียงต่อเนื่องได้</p><div class="scenarios" id="scenarios"></div><section class="panel"><div class="voicebar"><button class="start" id="hands">🎙️ เริ่มคุยอัตโนมัติ</button><div class="state"><span class="dot" id="dot"></span><span id="voiceState">พร้อม</span></div><button class="btn" id="mute" type="button">🔊 เสียง AI: เปิด</button></div><div class="chat" id="chat"></div><form class="composer" id="form"><button class="btn mic" type="button" id="mic">🎤</button><input id="input" autocomplete="off" placeholder="พิมพ์อังกฤษหรือไทยก็ได้..."><button class="send">ส่ง</button></form><div class="hint" id="hint">โหมดอัตโนมัติ: พูดจบแล้วระบบส่งเอง จากนั้น AI จะพูดตอบและเปิดไมค์รอคุณต่อ</div><div class="row"><button class="btn" id="clear" type="button">ล้างบทสนทนา</button><button class="btn" id="sample" type="button">ลองหัวข้อสนทนา</button></div></section></div><script>
(()=>{
const PROXY='https://kxdzlbyiowspghotzjvu.supabase.co/functions/v1/english-coach-test-proxy';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInR5cCI6IkpXVCJ9';
const AUTH='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInR5cCI6IkpXVCJ9';
const REAL_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4ZHpsYnlpb3dzcGdob3R6anZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxODcxNjEsImV4cCI6MjEwMzc2MzE2MX0.t6u85fzw5R36hBIw1WN60pEgKvBWu2fJH8-DliJmiQA';
const S={daily:'🌤️ ชีวิตประจำวัน',work:'💼 ที่ทำงาน',travel:'✈️ เดินทาง',restaurant:'🍽️ ร้านอาหาร'};
let scenario='daily',history=[{role:'ai',text:'Hi! Let’s chat like friends. How was your day today?',thai:'คุยกันสบาย ๆ เหมือนเพื่อนนะ วันนี้เป็นอย่างไรบ้าง?',source:'friend-starter'}],busy=false,rec=null,listening=false,handsFree=false,speaking=false,voiceOn=true,manualStop=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function setVoiceState(text,kind=''){ $('#voiceState').textContent=text; $('#dot').className='dot '+kind; }
function updateButtons(){ $('#hands').classList.toggle('live',handsFree); $('#hands').textContent=handsFree?'⏹️ หยุดสนทนา':'🎙️ เริ่มคุยอัตโนมัติ'; $('#mute').textContent=voiceOn?'🔊 เสียง AI: เปิด':'🔇 เสียง AI: ปิด'; }
function speak(text,thenListen=false){ return new Promise(resolve=>{ if(!voiceOn||!('speechSynthesis'in window)){ resolve(); if(thenListen&&handsFree)setTimeout(()=>startListen(true),250); return; } try{ if(listening){manualStop=true;rec?.stop();} }catch{} speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=.88; u.pitch=1; speaking=true; setVoiceState('AI กำลังพูด...','speak'); u.onend=()=>{speaking=false;resolve();if(thenListen&&handsFree)setTimeout(()=>startListen(true),350)};u.onerror=()=>{speaking=false;resolve();if(thenListen&&handsFree)setTimeout(()=>startListen(true),350)};speechSynthesis.speak(u); }); }
function render(){const sc=$('#scenarios');sc.innerHTML=Object.entries(S).map(([k,v])=>`<button data-s="${k}" class="${k===scenario?'active':''}">${v}</button>`).join('');sc.querySelectorAll('button').forEach(b=>b.onclick=()=>{scenario=b.dataset.s;render()});$('#chat').innerHTML=history.map((m,i)=>`<div class="bubble ${m.role==='user'?'user':''}">${esc(m.text)}${m.thai?`<small>${esc(m.thai)}</small>`:''}${m.role==='ai'?`<button class="speakBtn" data-i="${i}">🔊 ฟังซ้ำ</button>${m.source?`<div class="meta">${esc(m.source)}</div>`:''}`:''}</div>`).join('');$('#chat').querySelectorAll('.speakBtn').forEach(b=>b.onclick=()=>speak(history[Number(b.dataset.i)].text,false));$('#chat').scrollTop=$('#chat').scrollHeight;$('#status').textContent=busy?'AI THINKING':handsFree?'HANDS-FREE':'READY';updateButtons()}
async function send(text,fromVoice=false){text=String(text||'').trim();if(busy||!text)return;try{if(listening){manualStop=true;rec?.stop()}}catch{}history.push({role:'user',text});busy=true;setVoiceState('AI กำลังคิด...','wait');render();try{const r=await fetch(PROXY,{method:'POST',headers:{'content-type':'application/json','apikey':REAL_ANON,'authorization':'Bearer '+REAL_ANON},body:JSON.stringify({message:text,scenario,name:'Kung',history:history.slice(-12),mode:'friend'})});const d=await r.json();if(!r.ok)throw new Error(d?.message||d?.error||'request failed');history.push({role:'ai',text:d.text||'Tell me more.',thai:d.thai||'',source:d.source||'unknown'});busy=false;render();if(handsFree||fromVoice){await speak(d.text||'Tell me more.',handsFree)}else setVoiceState('พร้อม','')}catch(e){busy=false;history.push({role:'ai',text:'I lost the connection for a moment. Can you say that again?',thai:'การเชื่อมต่อสะดุด ลองพูดอีกครั้งได้เลย',source:'network-fallback'});render();if(handsFree)await speak(history.at(-1).text,true)}}
function startListen(autoSend){if(!SR){alert('เบราว์เซอร์นี้ยังไม่รองรับ Speech Recognition โดยตรง กรุณาใช้ Chrome/Edge ที่รองรับ หรือใช้ไมค์ของคีย์บอร์ด');handsFree=false;updateButtons();return}if(listening||busy||speaking||!handsFree&&autoSend)return;manualStop=false;rec=new SR();rec.lang='en-US';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;let final='';rec.onstart=()=>{listening=true;$('#mic').textContent='⏹️';setVoiceState('กำลังฟังคุณ...','listen')};rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=(final?' ':'')+t;else interim+=t}$('#input').value=(final||interim).trim()};rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){handsFree=false;setVoiceState('ไมค์ไม่ได้รับอนุญาต','');updateButtons()}else if(e.error!=='no-speech'&&e.error!=='aborted')setVoiceState('ไมค์: '+e.error,'')};rec.onend=()=>{listening=false;$('#mic').textContent='🎤';const text=final.trim();if(autoSend&&handsFree&&text){$('#input').value='';send(text,true);return}if(handsFree&&!manualStop&&!busy&&!speaking)setTimeout(()=>startListen(true),500);else if(!handsFree)setVoiceState('พร้อม','')};try{rec.start()}catch{listening=false}}
function startHands(){if(handsFree){handsFree=false;manualStop=true;try{rec?.stop()}catch{};try{speechSynthesis.cancel()}catch{};speaking=false;setVoiceState('หยุดแล้ว','');updateButtons();return}if(!SR){alert('เบราว์เซอร์นี้ไม่รองรับ Speech Recognition โดยตรง กรุณาใช้ Chrome/Edge ที่รองรับ');return}handsFree=true;updateButtons();const last=history.at(-1);if(last?.role==='ai')speak(last.text,true);else startListen(true)}
$('#hands').onclick=startHands;$('#mute').onclick=()=>{voiceOn=!voiceOn;if(!voiceOn)try{speechSynthesis.cancel()}catch{};updateButtons()};$('#form').onsubmit=e=>{e.preventDefault();const v=$('#input').value;$('#input').value='';send(v,false)};$('#mic').onclick=()=>{if(listening){manualStop=true;try{rec.stop()}catch{};return}startListen(false)};$('#clear').onclick=()=>{handsFree=false;manualStop=true;try{rec?.stop();speechSynthesis.cancel()}catch{};history=[{role:'ai',text:'Hi! Let’s chat like friends. How was your day today?',thai:'คุยกันสบาย ๆ เหมือนเพื่อนนะ วันนี้เป็นอย่างไรบ้าง?',source:'friend-starter'}];setVoiceState('พร้อม','');render()};$('#sample').onclick=()=>{$('#input').value='Can you talk with me about my day?';$('#input').focus()};render();
})();
</script></body></html>
