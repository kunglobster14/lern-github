<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>My English Coach V33</title>
<style>
:root{--bg:#07111f;--panel:#0e1c31;--panel2:#132642;--line:#243a5a;--text:#f8fafc;--muted:#94a3b8;--a:#7c3aed;--b:#0ea5e9;--ok:#22c55e;--bad:#ef4444}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#050d19,#07111f 35%,#081728);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.shell{max-width:960px;margin:auto;min-height:100vh;padding:18px 18px 104px}.top{position:sticky;top:0;z-index:5;background:rgba(7,17,31,.92);backdrop-filter:blur(14px);display:flex;justify-content:space-between;align-items:center;padding:10px 0 14px}.brand b{font-size:19px}.brand small{display:block;color:#67e8f9;font-weight:800;letter-spacing:.12em}.badge{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:#cbd5e1;font-size:12px}.hero,.card,.panel{background:linear-gradient(145deg,rgba(19,38,66,.95),rgba(10,24,43,.95));border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.18)}.hero h1{margin:8px 0;font-size:clamp(28px,5vw,46px)}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stat{background:#0a1728;border:1px solid var(--line);padding:14px;border-radius:16px;text-align:center}.stat b{display:block;font-size:22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.card{cursor:pointer;text-align:left;min-height:150px;transition:.15s transform,.15s border-color}.card:active{transform:scale(.99)}.card h3{font-size:20px;margin:8px 0}.icon{font-size:34px}.primary,.secondary,.choice,.game-card,.nav button{border:0;cursor:pointer}.primary{background:linear-gradient(135deg,var(--a),#4f46e5);color:white;border-radius:14px;padding:13px 18px;font-weight:800}.secondary{background:#15263b;color:#e2e8f0;border:1px solid var(--line);border-radius:14px;padding:13px 18px;font-weight:700}.row{display:flex;gap:10px;flex-wrap:wrap}.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 12px}.section-title h2{margin:0}.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(920px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,1fr);background:rgba(6,16,29,.97);border:1px solid var(--line);border-radius:24px;padding:8px;z-index:20}.nav button{background:transparent;color:#7f8fa6;padding:10px 4px;border-radius:17px;min-height:58px}.nav button.active{background:#18283e;color:white}.nav span{display:block;font-size:18px}.nav small{font-size:11px}.word{font-size:54px;font-weight:900;margin:10px 0}.meaning{font-size:22px;color:#cbd5e1}.example{margin:16px 0;padding:15px;background:#091728;border-radius:16px;border:1px solid var(--line)}.chat{display:flex;flex-direction:column;gap:12px;max-height:55vh;overflow:auto;padding:4px 0 14px}.bubble{max-width:82%;padding:13px 15px;border-radius:18px;background:#14253c;border:1px solid var(--line);line-height:1.45}.bubble.user{align-self:flex-end;background:linear-gradient(135deg,#6d28d9,#4f46e5)}.bubble small{display:block;color:#aab6c8;margin-top:6px}.composer{display:grid;grid-template-columns:1fr auto;gap:10px;position:sticky;bottom:84px;background:var(--bg);padding-top:10px}.composer input{width:100%;background:#0c1b2f;color:white;border:1px solid var(--line);border-radius:15px;padding:14px}.scenario{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.scenario button{white-space:nowrap}.scenario .active{outline:2px solid #8b5cf6}.game-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.game-card{background:#10223a;border:1px solid var(--line);border-radius:18px;padding:18px;color:white;text-align:left}.game-card b{display:block;font-size:18px;margin-top:6px}.choice-stack{display:grid;gap:10px;margin-top:16px}.choice{background:#132642;color:white;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left}.choice.ok{border-color:var(--ok);background:rgba(34,197,94,.14)}.choice.bad{border-color:var(--bad);background:rgba(239,68,68,.12)}.progress-list{display:grid;gap:10px}.progress-item{display:flex;justify-content:space-between;background:#0c1a2e;padding:14px;border:1px solid var(--line);border-radius:14px}.backbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.mission{border:1px solid #6d5ce7;background:linear-gradient(145deg,#172354,#0f2c48);padding:18px;border-radius:20px}.mission h3{font-size:24px;margin:8px 0}.hidden{display:none!important}@media(max-width:650px){.grid,.game-list{grid-template-columns:1fr 1fr}.shell{padding-left:12px;padding-right:12px}.hero,.card,.panel{border-radius:20px;padding:18px}.nav small{font-size:10px}.stats{grid-template-columns:repeat(3,1fr)}.bubble{max-width:90%}}@media(max-width:430px){.grid,.game-list{grid-template-columns:1fr}.stats{gap:6px}.stat{padding:10px}.stat b{font-size:18px}.nav{bottom:6px}.word{font-size:44px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><small>MY ENGLISH</small><b>English Coach · V33</b></div><div class="badge" id="modeBadge">STABLE MODE</div></header>
<main id="app"></main>
</div>
<nav class="nav" id="nav">
<button data-route="home"><span>⌂</span><small>หน้าแรก</small></button>
<button data-route="learn"><span>Aa</span><small>คำศัพท์</small></button>
<button data-route="ai"><span>✦</span><small>AI Coach</small></button>
<button data-route="review"><span>↻</span><small>ทบทวน</small></button>
<button data-route="progress"><span>▣</span><small>สถิติ</small></button>
</nav>
<script>
(()=>{
'use strict';
const KEY='myEnglishV2';
const WORDS=[
['work','ทำงาน / งาน','I work every day.'],['water','น้ำ','I need some water.'],['food','อาหาร','The food is good.'],['home','บ้าน','I am at home.'],['help','ความช่วยเหลือ','Can you help me, please?'],['time','เวลา','What time is it?'],['station','สถานี','Where is the station?'],['airport','สนามบิน','The airport is busy.'],['hotel','โรงแรม','I have a hotel reservation.'],['ticket','ตั๋ว','I need two tickets.'],['train','รถไฟ','I take the train to work.'],['taxi','แท็กซี่','Where can I get a taxi?'],['price','ราคา','What is the price?'],['card','บัตร','Can I pay by card?'],['cash','เงินสด','I only have cash.'],['family','ครอบครัว','I live with my family.'],['friend','เพื่อน','She is my friend.'],['meeting','ประชุม','I have a meeting at ten.'],['project','โครงการ','I am working on a project.'],['problem','ปัญหา','There is a problem.'],['happy','มีความสุข','I am happy today.'],['tired','เหนื่อย','I feel tired.'],['hungry','หิว','I am hungry.'],['please','กรุณา','Please wait here.'],['thanks','ขอบคุณ','Thanks for your help.'],['where','ที่ไหน','Where is the bathroom?'],['when','เมื่อไร','When do you start work?'],['why','ทำไม','Why are you late?'],['morning','ตอนเช้า','I drink coffee in the morning.'],['night','กลางคืน','I work at night.']
].map((x,id)=>({id,en:x[0],th:x[1],ex:x[2]}));
const SCENARIOS={daily:['🌤️ ชีวิตประจำวัน','Hi! How are you today?','ลองตอบ: I am good, thank you.'],coffee:['☕ ร้านกาแฟ','Hello! What would you like to drink?','ลองตอบ: I would like a coffee, please.'],travel:['✈️ เดินทาง','Hello! Where would you like to go?','ลองตอบ: I want to go to Bangkok.'],work:['💼 ที่ทำงาน','Good morning! What are you working on?','ลองตอบ: I am working on a project.'],restaurant:['🍽️ ร้านอาหาร','Welcome! What would you like to order?','ลองตอบ: I would like chicken and rice, please.'],shopping:['🛍️ ซื้อของ','Can I help you find something?','ลองตอบ: How much is this?'],hotel:['🏨 โรงแรม','Welcome to the hotel. How can I help you?','ลองตอบ: I have a reservation.'],airport:['🛫 สนามบิน','How can I help you at the airport?','ลองตอบ: Where is gate twelve?']};
const FALLBACK={name:'ผู้เรียน',known:[],weak:[],xp:0,streak:1,quizBest:0,scenario:'daily',chat:[],v33:{gamePlayed:0,correct:0,recent:[]}};
let state=load(),route='home',wordIndex=0,busy=false,game=null;
function load(){try{const s={...FALLBACK,...JSON.parse(localStorage.getItem(KEY)||'{}')};s.known=Array.isArray(s.known)?s.known:[];s.weak=Array.isArray(s.weak)?s.weak:[];s.chat=Array.isArray(s.chat)?s.chat:[];s.v33={...FALLBACK.v33,...(s.v33||{})};if(!SCENARIOS[s.scenario])s.scenario='daily';return s}catch{return structuredClone(FALLBACK)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function level(){return Math.max(1,Math.floor((Number(state.xp)||0)/100)+1)}
function navTo(next){route=next;game=null;render();window.scrollTo({top:0,behavior:'instant'})}
function setNav(){document.querySelectorAll('#nav [data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===route));document.querySelector('#nav').classList.toggle('hidden',route==='game')}
function home(){return `<section class="hero"><div class="muted">TODAY'S JOURNEY</div><h1>พร้อมฝึกอังกฤษไหม ${esc(state.name)}?</h1><p class="muted">V33 Stable Mode · ไม่มี modal และไม่มี render patch ซ้อน</p><div class="stats"><div class="stat"><b>${state.xp||0}</b><span class="muted">XP</span></div><div class="stat"><b>Lv.${level()}</b><span class="muted">ระดับ</span></div><div class="stat"><b>${state.known.length}</b><span class="muted">คำจำได้</span></div></div></section><div class="grid"><button class="card" data-action="mission"><div class="icon">✨</div><h3>AI Surprise Mission</h3><p class="muted">รับภารกิจแล้วเข้า AI Coach โดยตรง</p></button><button class="card" data-route-card="ai"><div class="icon">✦</div><h3>AI Conversation</h3><p class="muted">คุย ฝึกตอบ และแก้ประโยค</p></button><button class="card" data-route-card="games"><div class="icon">🎮</div><h3>Game Lab</h3><p class="muted">8 เกม · เปิดเป็นหน้า ไม่ใช้ popup</p></button><button class="card" data-route-card="learn"><div class="icon">Aa</div><h3>คำศัพท์</h3><p class="muted">เรียนคำพื้นฐาน + ตัวอย่าง</p></button></div>`}
function learn(){const w=WORDS[wordIndex%WORDS.length];return `<div class="section-title"><h2>Vocabulary</h2><span class="muted">${wordIndex+1}/${WORDS.length}</span></div><section class="panel"><div class="word">${esc(w.en)}</div><div class="meaning">${esc(w.th)}</div><div class="example">${esc(w.ex)}</div><div class="row"><button class="secondary" data-word="weak">ยังไม่จำ</button><button class="primary" data-word="known">จำได้แล้ว +10 XP</button></div></section>`}
function ai(){const sc=SCENARIOS[state.scenario];const msgs=state.chat.length?state.chat:[{role:'ai',text:sc[1],thai:'เริ่มตอบสั้น ๆ ได้เลย'}];return `<div class="section-title"><h2>AI Coach</h2><span class="muted">${busy?'กำลังตอบ...':'พร้อมคุย'}</span></div><div class="scenario">${Object.entries(SCENARIOS).map(([k,v])=>`<button class="secondary ${k===state.scenario?'active':''}" data-scenario="${k}">${v[0]}</button>`).join('')}</div><section class="panel"><div class="chat" id="chat">${msgs.map(m=>`<div class="bubble ${m.role==='user'?'user':''}">${esc(m.text)}${m.thai?`<small>${esc(m.thai)}</small>`:''}</div>`).join('')}</div><div class="example"><b>💡 ตัวช่วย</b><div class="muted">${esc(sc[2])}</div></div><form class="composer" id="chatForm"><input id="chatInput" placeholder="พิมพ์อังกฤษหรือไทยก็ได้..." ${busy?'disabled':''}><button class="primary" ${busy?'disabled':''}>ส่ง</button></form></section>`}
function review(){const list=state.weak.map(k=>WORDS.find(w=>w.en===k)).filter(Boolean);if(!list.length)return `<section class="panel"><h2>🎉 ไม่มีคำค้าง</h2><p class="muted">ตอนนี้ไม่มีคำที่ทำเครื่องหมายว่ายังไม่จำ</p><button class="primary" data-route-card="learn">เรียนคำใหม่</button></section>`;return `<div class="section-title"><h2>คำต้องทบทวน</h2><span>${list.length} คำ</span></div><div class="progress-list">${list.map(w=>`<div class="progress-item"><div><b>${esc(w.en)}</b><div class="muted">${esc(w.th)}</div></div><button class="secondary" data-review-known="${esc(w.en)}">จำได้แล้ว</button></div>`).join('')}</div>`}
function progress(){return `<div class="section-title"><h2>สถิติ</h2></div><section class="panel"><div class="stats"><div class="stat"><b>${state.xp||0}</b><span class="muted">XP</span></div><div class="stat"><b>${state.known.length}</b><span class="muted">คำจำได้</span></div><div class="stat"><b>${state.weak.length}</b><span class="muted">ต้องทบทวน</span></div></div><div class="progress-list" style="margin-top:16px"><div class="progress-item"><span>เกมที่เล่น V33</span><b>${state.v33.gamePlayed||0}</b></div><div class="progress-item"><span>ตอบเกมถูก</span><b>${state.v33.correct||0}</b></div><div class="progress-item"><span>Quiz สูงสุดเดิม</span><b>${state.quizBest||0}%</b></div></div></section>`}
const GAME_META={meaning:['🏃','Meaning Rush'],match:['🧩','Word Match'],gap:['🔤','Missing Word'],translate:['🇹🇭','Thai → English'],trap:['🎭','True or Trap'],dialog:['🗣️','Survival Dialog'],spell:['⌨️','Spell It'],sprint:['⚡','Flash Sprint']};
function games(){return `<div class="section-title"><h2>🎮 Game Lab V33</h2><span class="muted">หน้าเต็ม · ไม่มี modal</span></div><div class="game-list">${Object.entries(GAME_META).map(([k,v])=>`<button class="game-card" data-start-game="${k}"><span class="icon">${v[0]}</span><b>${v[1]}</b><small class="muted">กดเล่น แล้วกลับได้ทุกเมื่อ</small></button>`).join('')}</div>`}
function pick(except=[]){const pool=WORDS.filter(w=>!except.includes(w.id));return pool[Math.floor(Math.random()*pool.length)]}
function makeGame(type){const w=pick();if(type==='meaning'){const choices=[w.th,...[pick([w.id]),pick([w.id]),pick([w.id])].map(x=>x.th)];return{type,title:'🏃 Meaning Rush',prompt:`${w.en} แปลว่าอะไร?`,answer:w.th,choices}}if(type==='translate'){const wrong=[pick([w.id]).ex,pick([w.id]).ex,pick([w.id]).ex];return{type,title:'🇹🇭 Thai → English',prompt:w.th,answer:w.ex,choices:[w.ex,...wrong]}}if(type==='gap'){const parts=w.ex.split(' '),ix=Math.max(0,parts.findIndex(x=>x.toLowerCase().replace(/[^a-z]/g,'')===w.en));const ans=parts[ix]||w.en;parts[ix]='_____';return{type,title:'🔤 Missing Word',prompt:parts.join(' '),answer:ans,choices:[ans,pick([w.id]).en,pick([w.id]).en,pick([w.id]).en]}}if(type==='trap'){const truth=Math.random()>.5,shown=truth?w.th:pick([w.id]).th;return{type,title:'🎭 True or Trap',prompt:`${w.en} = ${shown}`,answer:truth?'จริง':'หลอก',choices:['จริง','หลอก']}}if(type==='dialog'){const qs=[['คุณต้องการขอความช่วยเหลือ','Can you help me, please?'],['คุณต้องการถามทางไปสถานี','Where is the station?'],['คุณต้องการจ่ายด้วยบัตร','Can I pay by card?'],['คุณต้องการบอกว่าจองโรงแรมไว้แล้ว','I have a hotel reservation.']];const q=qs[Math.floor(Math.random()*qs.length)];return{type,title:'🗣️ Survival Dialog',prompt:q[0],answer:q[1],choices:[q[1],pick().ex,pick().ex,pick().ex]}}if(type==='spell'){return{type,title:'⌨️ Spell It',prompt:`พิมพ์คำอังกฤษของ “${w.th}”`,answer:w.en,input:true}}if(type==='match'){const a=[w,pick([w.id]),pick([w.id]),pick([w.id])];const target=a[Math.floor(Math.random()*a.length)];return{type,title:'🧩 Word Match',prompt:`จับคู่ความหมายของ ${target.en}`,answer:target.th,choices:a.map(x=>x.th)}}const a=[w,pick([w.id]),pick([w.id]),pick([w.id])];return{type,title:'⚡ Flash Sprint',prompt:`เลือกคำอังกฤษของ “${w.th}”`,answer:w.en,choices:a.map(x=>x.en)}}
function gameView(){if(!game)return games();return `<div class="backbar"><button class="secondary" data-exit-game>← กลับ Game Lab</button><span class="muted">ปิดได้ทุกเมื่อ</span></div><section class="panel"><h2>${game.title}</h2><p class="muted">${esc(game.prompt)}</p>${game.input?`<form id="gameInputForm" class="composer" style="bottom:auto"><input id="gameAnswer" autocomplete="off"><button class="primary">ตรวจ</button></form>`:`<div class="choice-stack">${shuffle(game.choices).map(c=>`<button class="choice" data-game-choice="${esc(c)}">${esc(c)}</button>`).join('')}</div>`}<div id="gameFeedback" style="margin-top:14px"></div></section>`}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function render(){setNav();const app=document.querySelector('#app');app.innerHTML=route==='home'?home():route==='learn'?learn():route==='ai'?ai():route==='review'?review():route==='progress'?progress():route==='games'?games():route==='game'?gameView():home();bind();requestAnimationFrame(()=>{const c=document.querySelector('#chat');if(c)c.scrollTop=c.scrollHeight})}
function bind(){document.querySelectorAll('[data-route-card]').forEach(b=>b.onclick=()=>navTo(b.dataset.routeCard));document.querySelectorAll('[data-action="mission"]').forEach(b=>b.onclick=startMission);document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>markWord(b.dataset.word));document.querySelectorAll('[data-review-known]').forEach(b=>b.onclick=()=>{state.weak=state.weak.filter(x=>x!==b.dataset.reviewKnown);if(!state.known.includes(b.dataset.reviewKnown))state.known.push(b.dataset.reviewKnown);save();render()});document.querySelectorAll('[data-scenario]').forEach(b=>b.onclick=()=>{state.scenario=b.dataset.scenario;state.chat=[];save();render()});document.querySelector('#chatForm')?.addEventListener('submit',sendChat);document.querySelectorAll('[data-start-game]').forEach(b=>b.onclick=()=>{game=makeGame(b.dataset.startGame);route='game';render()});document.querySelector('[data-exit-game]')?.addEventListener('click',()=>{game=null;route='games';render()});document.querySelectorAll('[data-game-choice]').forEach(b=>b.onclick=()=>answerGame(b,b.dataset.gameChoice));document.querySelector('#gameInputForm')?.addEventListener('submit',e=>{e.preventDefault();answerGame(null,document.querySelector('#gameAnswer').value.trim())})}
function markWord(kind){const w=WORDS[wordIndex%WORDS.length];if(kind==='known'){if(!state.known.includes(w.en)){state.known.push(w.en);state.xp=(state.xp||0)+10}state.weak=state.weak.filter(x=>x!==w.en)}else if(!state.weak.includes(w.en))state.weak.push(w.en);wordIndex=(wordIndex+1)%WORDS.length;save();render()}
function startMission(){const missions=[['Say three short sentences about your day.','พูด 3 ประโยคสั้น ๆ เกี่ยวกับวันนี้'],['Ask for help politely in English.','ขอความช่วยเหลือเป็นภาษาอังกฤษอย่างสุภาพ'],['Tell me what you want to eat and drink.','บอกสิ่งที่คุณอยากกินและดื่ม'],['Introduce yourself in two sentences.','แนะนำตัวเอง 2 ประโยค']];const m=missions[Math.floor(Math.random()*missions.length)];state.chat.push({role:'ai',text:`🎯 Mission: ${m[0]}`,thai:m[1]});state.chat=state.chat.slice(-16);save();navTo('ai')}
async function sendChat(e){e.preventDefault();if(busy)return;const input=document.querySelector('#chatInput');const text=input.value.trim();if(!text)return;state.chat.push({role:'user',text});state.chat=state.chat.slice(-16);busy=true;save();render();let reply;try{const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),12000);const r=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json'},signal:ctrl.signal,body:JSON.stringify({message:text,scenario:state.scenario,name:state.name,history:state.chat.slice(-10)})});clearTimeout(timer);if(!r.ok)throw 0;reply=await r.json();if(!reply?.text)throw 0;document.querySelector('#modeBadge').textContent='FREE ONLINE'}catch{reply=localCoach(text);document.querySelector('#modeBadge').textContent='LOCAL COACH'}state.chat.push({role:'ai',text:String(reply.text||''),thai:String(reply.thai||'')});state.chat=state.chat.slice(-16);state.xp=(state.xp||0)+2;busy=false;save();render()}
function localCoach(text){const t=text.toLowerCase();if(/[ก-๙]/.test(text))return{text:'Try saying it in simple English. Start with “I am…”, “I want…”, or “I need…”.',thai:'ลองเปลี่ยนเป็นอังกฤษสั้น ๆ ก่อน'};if(/^i want you help\b/.test(t))return{text:'A natural correction is: “I want you to help me.” You can also say: “Can you help me, please?”',thai:'หลัง want you ต้องใช้ to help และเติม me ให้ครบความหมาย'};if(t.startsWith('i want'))return{text:'Good. Now make it more natural by adding one detail or “please” when asking for something.',thai:'ดีครับ ลองเพิ่มรายละเอียดหรือ please'};if(t.startsWith('i am'))return{text:'Nice! Tell me one more detail about why or what happened.',thai:'ดีมาก ลองเพิ่มเหตุผลหรือรายละเอียดอีกหนึ่งอย่าง'};return{text:'Good try! Keep it short and clear. Can you tell me one more thing?',thai:'ทำได้ดี ลองเพิ่มรายละเอียดอีก 1 อย่าง'}}
function answerGame(btn,value){const ok=String(value).toLowerCase()===String(game.answer).toLowerCase();state.v33.gamePlayed=(state.v33.gamePlayed||0)+1;if(ok){state.v33.correct=(state.v33.correct||0)+1;state.xp=(state.xp||0)+5}save();document.querySelectorAll('[data-game-choice]').forEach(x=>x.disabled=true);if(btn)btn.classList.add(ok?'ok':'bad');const fb=document.querySelector('#gameFeedback');fb.innerHTML=`<div class="example"><b>${ok?'✅ ถูกต้อง +5 XP':'❌ คำตอบที่ถูก: '+esc(game.answer)}</b></div><div class="row"><button class="primary" id="againGame">เล่นอีกข้อ</button><button class="secondary" id="backGames">เลือกเกมอื่น</button><button class="secondary" id="homeFromGame">กลับหน้าแรก</button></div>`;document.querySelector('#againGame').onclick=()=>{game=makeGame(game.type);render()};document.querySelector('#backGames').onclick=()=>{game=null;route='games';render()};document.querySelector('#homeFromGame').onclick=()=>navTo('home')}
document.querySelectorAll('#nav [data-route]').forEach(b=>b.onclick=()=>navTo(b.dataset.route));
render();
})();
</script>
</body>
