<style>
:root{--bg:#07111f;--panel:#0e1c31;--panel2:#132642;--line:#243a5a;--text:#f8fafc;--muted:#94a3b8;--a:#7c3aed;--b:#0ea5e9;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#050d19,#07111f 35%,#081728);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}.shell{max-width:1000px;margin:auto;min-height:100vh;padding:18px 18px 112px}.top{position:sticky;top:0;z-index:10;background:rgba(7,17,31,.95);backdrop-filter:blur(14px);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0 14px}
.brand b{font-size:20px}.brand small{display:block;color:#67e8f9;font-weight:800;letter-spacing:.12em}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.badge,.chip{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:#cbd5e1;font-size:12px}
.hero,.card,.panel,.lesson,.core-card{background:linear-gradient(145deg,rgba(19,38,66,.96),rgba(10,24,43,.96));border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.hero h1{margin:8px 0;font-size:clamp(28px,5vw,44px)}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#0a1728;border:1px solid var(--line);padding:14px;border-radius:16px;text-align:center}.stat b{display:block;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.card{cursor:pointer;text-align:left;min-height:145px;transition:.15s transform,.15s border-color}.card:active{transform:scale(.99)}.card h3{font-size:20px;margin:8px 0}.icon{font-size:34px}

.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(960px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,1fr);background:rgba(6,16,29,.98);border:1px solid var(--line);border-radius:24px;padding:8px;z-index:30}.nav button{background:transparent;color:#7f8fa6;padding:10px 4px;border-radius:17px;min-height:58px}.nav button.active{background:#18283e;color:white}.nav span{display:block;font-size:18px}.nav small{font-size:11px}
.word{font-size:54px;font-weight:900;margin:10px 0}.meaning{font-size:22px;color:#cbd5e1}.example{margin:16px 0;padding:15px;background:#091728;border-radius:16px;border:1px solid var(--line)}
.chat{display:flex;flex-direction:column;gap:12px;max-height:52vh;overflow:auto;padding:4px 0 14px}.bubble{max-width:82%;padding:13px 15px;border-radius:18px;background:#14253c;border:1px solid var(--line);line-height:1.45}.bubble.user{align-self:flex-end;background:linear-gradient(135deg,#6d28d9,#4f46e5)}.bubble small{display:block;color:#aab6c8;margin-top:6px}.composer{display:grid;grid-template-columns:1fr auto;gap:10px;position:sticky;bottom:84px;background:var(--bg);padding-top:10px}.composer input,.field{width:100%;background:#0c1b2f;color:white;border:1px solid var(--line);border-radius:15px;padding:14px}.scenario{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.scenario button{white-space:nowrap}.scenario .active{outline:2px solid #8b5cf6}
.game-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.game-card{background:#10223a;border:1px solid var(--line);border-radius:18px;padding:18px;color:white;text-align:left}.game-card b{display:block;font-size:18px;margin-top:6px}.choice-stack{display:grid;gap:10px;margin-top:16px}.choice{background:#132642;color:white;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left}.choice.ok{border-color:var(--ok);background:rgba(34,197,94,.14)}.choice.bad{border-color:var(--bad);background:rgba(239,68,68,.12)}
.backbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.mission{border:1px solid #6d5ce7;background:linear-gradient(145deg,#172354,#0f2c48);padding:18px;border-radius:20px}.mission h3{font-size:24px;margin:8px 0}
.road-level{margin:18px 0}.road-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:10px}.road-list{display:grid;gap:10px}.lesson{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px}.lesson.done{border-color:#166534;background:linear-gradient(145deg,rgba(20,83,45,.34),rgba(10,24,43,.96))}.lesson b{display:block}.lesson small{color:var(--muted)}.pattern{font-size:25px;font-weight:800;margin:12px 0}.examples{display:grid;gap:8px}.examples div{background:#0b1a2d;padding:12px;border:1px solid var(--line);border-radius:12px}.progressbar{height:10px;background:#0a1728;border-radius:999px;overflow:hidden;border:1px solid var(--line)}.progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b))}
.core-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.core-word{font-size:50px;font-weight:900}.core-card .listen{width:100%;margin:12px 0}.core-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.core-list{display:grid;gap:10px}.core-item{display:flex;justify-content:space-between;gap:10px;padding:12px;background:#0b1a2d;border:1px solid var(--line);border-radius:12px}
.account-card{max-width:520px;margin:6vh auto;background:linear-gradient(145deg,#132642,#0b1729);border:1px solid var(--line);border-radius:26px;padding:24px}.account-card h1{margin:8px 0}.account-card label{display:block;margin:14px 0 6px}.error{color:#fca5a5;min-height:22px;margin:10px 0}.admin-list{display:grid;gap:10px}.admin-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#0b1a2d;border:1px solid var(--line);padding:13px;border-radius:14px}.admin-create{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-top:14px}
.hidden{display:none!important}
@media(max-width:700px){.grid,.game-list{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)}.admin-create{grid-template-columns:1fr}.lesson{align-items:flex-start}.shell{padding-left:12px;padding-right:12px}.hero,.card,.panel,.lesson,.core-card{border-radius:20px;padding:18px}.bubble{max-width:90%}}
@media(max-width:430px){.grid,.game-list{grid-template-columns:1fr}.nav{bottom:6px}.word,.core-word{font-size:44px}.core-actions{grid-template-columns:1fr}}
</style>

<script>
(()=>{
'use strict';
const KEY='myEnglishV2',PATH_KEY='myEnglishLearningPathV1',COMPLETE_KEY='myEnglishCompleteCourseV1';
const WORDS=[['work','ทำงาน / งาน','I work every day.'],['water','น้ำ','I need some water.'],['food','อาหาร','The food is good.'],['home','บ้าน','I am at home.'],['help','ความช่วยเหลือ','Can you help me, please?'],['time','เวลา','What time is it?'],['station','สถานี','Where is the station?'],['airport','สนามบิน','The airport is busy.'],['hotel','โรงแรม','I have a hotel reservation.'],['ticket','ตั๋ว','I need two tickets.'],['train','รถไฟ','I take the train to work.'],['taxi','แท็กซี่','Where can I get a taxi?'],['price','ราคา','What is the price?'],['card','บัตร','Can I pay by card?'],['cash','เงินสด','I only have cash.'],['family','ครอบครัว','I live with my family.'],['friend','เพื่อน','She is my friend.'],['meeting','ประชุม','I have a meeting at ten.'],['project','โครงการ','I am working on a project.'],['problem','ปัญหา','There is a problem.'],['happy','มีความสุข','I am happy today.'],['tired','เหนื่อย','I feel tired.'],['hungry','หิว','I am hungry.'],['please','กรุณา','Please wait here.'],['thanks','ขอบคุณ','Thanks for your help.']].map((x,id)=>({id,en:x[0],th:x[1],ex:x[2]}));
const SCENARIOS={daily:['🌤️ ชีวิตประจำวัน','Hi! How are you today?','ลองตอบ: I am good, thank you.'],coffee:['☕ ร้านกาแฟ','Hello! What would you like to drink?','ลองตอบ: I would like a coffee, please.'],travel:['✈️ เดินทาง','Hello! Where would you like to go?','ลองตอบ: I want to go to Bangkok.'],work:['💼 ที่ทำงาน','Good morning! What are you working on?','ลองตอบ: I am working on a project.'],restaurant:['🍽️ ร้านอาหาร','Welcome! What would you like to order?','ลองตอบ: I would like chicken and rice, please.'],shopping:['🛍️ ซื้อของ','Can I help you find something?','ลองตอบ: How much is this?'],hotel:['🏨 โรงแรม','Welcome to the hotel. How can I help you?','ลองตอบ: I have a reservation.'],airport:['🛫 สนามบิน','How can I help you at the airport?','ลองตอบ: Where is gate twelve?']};
const LEVELS=[
{id:'L0',title:'เริ่มจากศูนย์',goal:'พูดแนะนำตัวและตอบคำถามง่าย ๆ ได้',units:[
{id:'l0u1',title:'Hello English',focus:'ทักทายและแนะนำตัว',pattern:'Hello. My name is ___.',examples:[['Hello!','สวัสดี'],['My name is Kung.','ฉันชื่อกุ้ง'],['Nice to meet you.','ยินดีที่ได้รู้จัก']],ai:'Introduce yourself in 2 short sentences.'},
{id:'l0u2',title:'Yes / No / Please',focus:'คำเอาตัวรอดพื้นฐาน',pattern:'Yes, please. / No, thank you.',examples:[['Yes, please.','ใช่ครับ/ค่ะ'],['No, thank you.','ไม่ ขอบคุณ'],['Sorry.','ขอโทษ']],ai:'Practice a tiny polite conversation using yes, no, please, and thank you.'},
{id:'l0u3',title:'I am / You are',focus:'รู้จัก verb to be',pattern:'I am ___. / You are ___.',examples:[['I am tired.','ฉันเหนื่อย'],['I am ready.','ฉันพร้อม'],['You are kind.','คุณใจดี']],ai:'Ask me how I am and help me answer with I am...'},
{id:'l0u4',title:'Numbers & Time',focus:'ตัวเลข อายุ เวลา',pattern:'I am ___ years old. / It is ___ o’clock.',examples:[['I am thirty years old.','ฉันอายุ 30 ปี'],['It is nine o’clock.','ตอนนี้ 9 โมง'],['Two tickets, please.','ขอตั๋วสองใบ']],ai:'Practice numbers, age, and simple time questions.'}]},
{id:'L1',title:'เอาตัวรอดในชีวิตประจำวัน',goal:'ขอของ ถามราคา ถามทาง และตอบเรื่องตัวเองได้',units:[
{id:'l1u1',title:'I want / I need',focus:'บอกความต้องการ',pattern:'I want ___. / I need ___.',examples:[['I want water.','ฉันต้องการน้ำ'],['I need help.','ฉันต้องการความช่วยเหลือ'],['I need a room.','ฉันต้องการห้องพัก']],ai:'Role-play a simple situation where I need to ask for something.'},
{id:'l1u2',title:'I like / I don’t like',focus:'ความชอบ',pattern:'I like ___. / I don’t like ___.',examples:[['I like coffee.','ฉันชอบกาแฟ'],['I don’t like spicy food.','ฉันไม่ชอบอาหารเผ็ด'],['I like music.','ฉันชอบดนตรี']],ai:'Ask me 3 easy questions about things I like.'},
{id:'l1u3',title:'Where / How much',focus:'ถามทางและราคา',pattern:'Where is ___? / How much is this?',examples:[['Where is the station?','สถานีอยู่ที่ไหน'],['Where is the bathroom?','ห้องน้ำอยู่ที่ไหน'],['How much is this?','อันนี้ราคาเท่าไร']],ai:'Practice asking directions and prices in a shop.'},
{id:'l1u4',title:'Daily Routine',focus:'เล่ากิจวัตร',pattern:'I ___ every day.',examples:[['I work every day.','ฉันทำงานทุกวัน'],['I go home at six.','ฉันกลับบ้านหกโมง'],['I drink coffee in the morning.','ฉันดื่มกาแฟตอนเช้า']],ai:'Ask me about my daily routine using very easy questions.'}]},
{id:'L2',title:'ต่อประโยคให้เป็น',goal:'พูดเรื่องปัจจุบัน อดีต อนาคต และความสามารถได้',units:[
{id:'l2u1',title:'Can / Can’t',focus:'ความสามารถและการขออนุญาต',pattern:'I can ___. / Can I ___?',examples:[['I can speak a little English.','ฉันพูดอังกฤษได้นิดหน่อย'],['Can I sit here?','ฉันนั่งตรงนี้ได้ไหม'],['I can’t understand.','ฉันไม่เข้าใจ']],ai:'Practice can and can’t with me.'},
{id:'l2u2',title:'Present Simple Questions',focus:'ถามด้วย do / does',pattern:'Do you ___?',examples:[['Do you work here?','คุณทำงานที่นี่ไหม'],['Do you like coffee?','คุณชอบกาแฟไหม'],['What do you do?','คุณทำงานอะไร']],ai:'Ask me 4 present-simple questions and correct my answers.'},
{id:'l2u3',title:'Past Basics',focus:'เล่าเมื่อวานแบบง่าย',pattern:'Yesterday I ___.',examples:[['Yesterday I worked.','เมื่อวานฉันทำงาน'],['I went home early.','ฉันกลับบ้านเร็ว'],['I had coffee.','ฉันดื่มกาแฟ']],ai:'Help me tell a 3-sentence story about yesterday.'},
{id:'l2u4',title:'Future Basics',focus:'แผนพรุ่งนี้',pattern:'Tomorrow I will ___. / I’m going to ___.',examples:[['Tomorrow I will work.','พรุ่งนี้ฉันจะทำงาน'],['I’m going to travel.','ฉันกำลังจะเดินทาง'],['I will call you later.','ฉันจะโทรหาคุณทีหลัง']],ai:'Ask me about my plans for tomorrow.'}]},
{id:'L3',title:'สถานการณ์จริง',goal:'คุยในร้านอาหาร ร้านค้า โรงแรม สนามบิน และที่ทำงานได้',units:[
{id:'l3u1',title:'Restaurant',focus:'สั่งอาหารและเช็กบิล',pattern:'I’d like ___, please.',examples:[['I’d like chicken and rice, please.','ขอไก่กับข้าวครับ/ค่ะ'],['No spicy, please.','ไม่เผ็ดครับ/ค่ะ'],['The bill, please.','ขอเช็กบิล']],ai:'Role-play a restaurant. You are the server and I am the customer.'},
{id:'l3u2',title:'Shopping',focus:'ถามราคา ขนาด สี',pattern:'Do you have this in ___?',examples:[['How much is this?','อันนี้ราคาเท่าไร'],['Do you have a larger size?','มีไซซ์ใหญ่กว่านี้ไหม'],['Can I pay by card?','จ่ายบัตรได้ไหม']],ai:'Role-play shopping for clothes and help me ask price, size, and payment.'},
{id:'l3u3',title:'Hotel & Travel',focus:'เช็กอินและถามข้อมูล',pattern:'I have a reservation.',examples:[['I have a reservation.','ฉันจองไว้แล้ว'],['What time is breakfast?','อาหารเช้ากี่โมง'],['Where is the elevator?','ลิฟต์อยู่ที่ไหน']],ai:'Role-play hotel check-in with simple English.'},
{id:'l3u4',title:'Airport & Directions',focus:'เกต กระเป๋า การเดินทาง',pattern:'Where is gate ___?',examples:[['Where is gate twelve?','เกต 12 อยู่ไหน'],['Where can I get a taxi?','ฉันเรียกแท็กซี่ได้ที่ไหน'],['My bag is missing.','กระเป๋าฉันหาย']],ai:'Role-play an airport situation from check-in to finding the gate.'},
{id:'l3u5',title:'Workplace English',focus:'คุยงานง่าย ๆ',pattern:'I’m working on ___.',examples:[['I’m working on a report.','ฉันกำลังทำรายงาน'],['I have a meeting at ten.','ฉันมีประชุม 10 โมง'],['Can you send me an email?','ส่งอีเมลให้ฉันได้ไหม']],ai:'Practice a simple workplace conversation with me.'}]},
{id:'L4',title:'คุยให้ต่อเนื่อง',goal:'ถามต่อ อธิบายเหตุผล แสดงความเห็น และแก้สถานการณ์ได้',units:[
{id:'l4u1',title:'Follow-up Questions',focus:'ถามต่อให้บทสนทนาไหล',pattern:'Really? Why? / What about you?',examples:[['Really?','จริงเหรอ'],['Why do you like it?','ทำไมคุณถึงชอบมัน'],['What about you?','แล้วคุณล่ะ']],ai:'Have a conversation with me and require me to ask follow-up questions.'},
{id:'l4u2',title:'Opinions',focus:'แสดงความคิดเห็น',pattern:'I think ___. / In my opinion, ___.',examples:[['I think it is good.','ฉันคิดว่ามันดี'],['In my opinion, it is too expensive.','ฉันคิดว่ามันแพงเกินไป'],['I agree.','ฉันเห็นด้วย']],ai:'Ask my opinion about 3 easy everyday topics.'},
{id:'l4u3',title:'Explain a Problem',focus:'บอกปัญหาและขอความช่วยเหลือ',pattern:'There is a problem with ___.',examples:[['There is a problem with my room.','ห้องของฉันมีปัญหา'],['My computer is not working.','คอมพิวเตอร์ฉันใช้ไม่ได้'],['Could you help me?','ช่วยฉันได้ไหม']],ai:'Give me a small problem and make me explain it and ask for help.'},
{id:'l4u4',title:'Tell a Short Story',focus:'เล่าเหตุการณ์ 4–5 ประโยค',pattern:'First... Then... After that... Finally...',examples:[['First, I went to work.','ก่อนอื่นฉันไปทำงาน'],['Then, I had lunch.','จากนั้นฉันกินข้าวกลางวัน'],['Finally, I went home.','สุดท้ายฉันกลับบ้าน']],ai:'Help me tell a short story using first, then, after that, and finally.'}]},
{id:'L5',title:'Conversation Ready',goal:'สนทนา 5–10 นาทีในหัวข้อคุ้นเคยได้',units:[
{id:'l5u1',title:'Small Talk 5 Minutes',focus:'คุยเรื่องวัน งาน อาหาร งานอดิเรก',pattern:'Keep the conversation going.',examples:[['How was your day?','วันนี้เป็นอย่างไรบ้าง'],['What do you do in your free time?','เวลาว่างคุณทำอะไร'],['That sounds interesting.','ฟังดูน่าสนใจ']],ai:'Have a 5-minute beginner-friendly small-talk conversation. Ask one question at a time.'},
{id:'l5u2',title:'Travel Challenge',focus:'เดินทางตั้งแต่สนามบินถึงโรงแรม',pattern:'Solve the situation in English.',examples:[['My flight is delayed.','เที่ยวบินฉันล่าช้า'],['I need to change my booking.','ฉันต้องการเปลี่ยนการจอง'],['Could you say that again?','พูดอีกครั้งได้ไหม']],ai:'Give me a multi-step travel role-play. Do not tell me the next step until I answer.'},
{id:'l5u3',title:'Work Conversation',focus:'อัปเดตงาน ถามงาน และขอความช่วยเหลือ',pattern:'Here is my update...',examples:[['I finished the first part.','ฉันทำส่วนแรกเสร็จแล้ว'],['I need more time.','ฉันต้องการเวลาเพิ่ม'],['Can we discuss this later?','เราคุยเรื่องนี้ทีหลังได้ไหม']],ai:'Run a simple work meeting role-play with status update and follow-up questions.'},

function loadState(){try{const s={...FALLBACK,...JSON.parse(localStorage.getItem(KEY)||'{}')};s.known=Array.isArray(s.known)?s.known:[];s.weak=Array.isArray(s.weak)?s.weak:[];s.chat=Array.isArray(s.chat)?s.chat:[];s.core3000Plan={...FALLBACK.core3000Plan,...(s.core3000Plan||{})};if(!SCENARIOS[s.scenario])s.scenario='daily';return s}catch{return JSON.parse(JSON.stringify(FALLBACK))}}

function bind(){document.querySelectorAll('[data-route-card]').forEach(b=>b.onclick=()=>navTo(b.dataset.routeCard));document.querySelectorAll('#nav [data-route]').forEach(b=>b.onclick=()=>navTo(b.dataset.route));document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{lessonId=b.dataset.lesson;route='lesson';render();window.scrollTo(0,0)});document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));document.querySelectorAll('[data-scenario]').forEach(b=>b.onclick=()=>{state.scenario=b.dataset.scenario;state.chat=[];saveLocal();render()});document.querySelector('#chatForm')?.addEventListener('submit',sendChat);document.querySelector('[data-action="mission"]')?.addEventListener('click',startMission);document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>markWord(b.dataset.word));document.querySelectorAll('[data-done-lesson]').forEach(b=>b.onclick=()=>completeLesson(b.dataset.doneLesson));document.querySelectorAll('[data-ai-lesson]').forEach(b=>b.onclick=()=>lessonAI(b.dataset.aiLesson));document.querySelector('#startCore')?.addEventListener('click',startCore);document.querySelector('#retryCore')?.addEventListener('click',startCore);document.querySelector('#exitCore')?.addEventListener('click',()=>{coreSession=null;render()});document.querySelector('#coreUnderstand')?.addEventListener('click',()=>{coreSession.understood.add(coreSession.cards[coreSession.idx].word);render()});document.querySelector('#coreListen')?.addEventListener('click',()=>{const w=coreSession.cards[coreSession.idx].word;speak(w);coreSession.repeats[w]=Math.min(3,(coreSession.repeats[w]||0)+1);render()});document.querySelector('#corePass')?.addEventListener('click',passCore);document.querySelector('#coreWeak')?.addEventListener('click',weakCore);document.querySelector('#aLogin')?.addEventListener('click',()=>accountSubmit('login'));document.querySelector('#aRegister')?.addEventListener('click',()=>accountSubmit('register'))}
function markWord(type){const i=state.v34?.wordIndex||0,w=WORDS[i%WORDS.length];state.v34={...(state.v34||{}),wordIndex:(i+1)%WORDS.length};if(type==='known'){if(!state.known.includes(w.en)){state.known.push(w.en);state.xp=(Number(state.xp)||0)+10}state.weak=state.weak.filter(x=>x!==w.en)}else if(!state.weak.includes(w.en))state.weak.push(w.en);saveLocal();render()}

function startMission(){state.chat.push({role:'ai',text:'🎯 Mission: Say three short sentences about your day.',thai:'พูด 3 ประโยคสั้น ๆ เกี่ยวกับวันนี้'});state.chat=state.chat.slice(-18);saveLocal();navTo('ai')}
async function sendChat(e){e.preventDefault();if(busy)return;const input=document.querySelector('#chatInput'),text=input.value.trim();if(!text)return;state.chat.push({role:'user',text});state.chat=state.chat.slice(-18);busy=true;saveLocal();render();let reply;try{const ctrl=new AbortController(),t=setTimeout(()=>ctrl.abort(),12000);const r=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json'},signal:ctrl.signal,body:JSON.stringify({message:text,scenario:state.scenario,name:state.name,history:state.chat.slice(-10)})});clearTimeout(t);if(!r.ok)throw 0;reply=await r.json();if(!reply?.text)throw 0;setBadge(account.enabled?'TEMP DB · GROQ':'GROQ')}catch{reply=localCoach(text);setBadge(account.enabled?'TEMP DB · LOCAL COACH':'LOCAL PREVIEW')}state.chat.push({role:'ai',text:String(reply.text||''),thai:String(reply.thai||'')});state.chat=state.chat.slice(-18);state.xp=(Number(state.xp)||0)+2;busy=false;saveLocal();render();try{speak(reply.text)}catch{}}
function localCoach(text){const t=text.toLowerCase().trim();if(/[ก-๙]/.test(text))return{text:'Try saying it in simple English. Start with “I want…”, “I need…”, or “I am…”.',thai:'ลองเปลี่ยนเป็นอังกฤษสั้น ๆ ก่อน'};if(/^i want you help/.test(t))return{text:'A better sentence is: “I want you to help me.” You can also say: “Can you help me, please?”',thai:'หลัง want you ใช้ to help me และถ้าขอความช่วยเหลือแบบธรรมชาติใช้ Can you help me, please?'};if(t.startsWith('i am'))return{text:'Nice! Add one more detail. For example: “I am tired because I worked today.”',thai:'ดีมาก ลองเพิ่มรายละเอียดอีกหนึ่งส่วน'};return{text:'Good try! Keep it short and clear. Tell me one more detail.',thai:'ทำได้ดี ลองเพิ่มรายละเอียดอีกหนึ่งอย่าง'}}
async function startCore(){coreSession={loading:true,error:'',cards:[],idx:0,repeats:{},understood:new Set(),done:false};render();try{const words=await loadCoreWords();const p=state.core3000Plan,start=Math.min(Number(p.mastered)||0,2999),daily=Math.max(1,Math.min(20,Number(p.daily)||12)),today=words.slice(start,start+daily),cards=await enrichCore(today,start);coreSession={loading:false,error:'',cards,idx:0,repeats:{},understood:new Set(),done:false};render()}catch(err){coreSession.loading=false;coreSession.error=String(err?.message||'ไม่สามารถโหลดคำได้');render()}}
async function loadCoreWords(){const cached=JSON.parse(localStorage.getItem('myEnglishCore3000ListV1')||'null');if(Array.isArray(cached)&&cached.length===3000)return cached;const r=await fetch(SOURCE,{cache:'force-cache'});if(!r.ok)throw new Error('โหลดรายการคำศัพท์ไม่ได้');const raw=await r.text(),seen=new Set(),out=[];for(const item of raw.split(/\r?\n/)){const w=item.trim().toLowerCase();if(!/^[a-z]{2,}$/.test(w)||seen.has(w))continue;if(/^(casino|gambling|lingerie|naked|sexual|poker|babes)$/.test(w))continue;seen.add(w);out.push(w);if(out.length===3000)break}if(out.length<3000)throw new Error('รายการคำไม่ครบ 3000');localStorage.setItem('myEnglishCore3000ListV1',JSON.stringify(out));state.core3000Plan.sourceReady=true;saveLocal();return out}
async function enrichCore(words,start){let data=null;try{const r=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mode:'vocab_batch',words})});if(r.ok)data=await r.json()}catch{}const map={};if(Array.isArray(data?.cards))data.cards.forEach(c=>map[c.word]=c);return words.map((w,i)=>{const c=map[w],p=PREVIEW[w];if(c?.thai&&c?.example&&c?.exampleThai)return{word:w,thai:c.thai,example:c.example,exampleThai:c.exampleThai,cefr:(start+i)<750?'A1':(start+i)<1500?'A2':(start+i)<2250?'B1':'B2',rank:start+i};if(p)return{word:w,thai:p[0],example:p[1],exampleThai:p[2],cefr:'A1',rank:start+i};throw new Error(`คำ "${w}" ยังไม่มีคำแปลใน preview กรุณาทดสอบ Core 3000 บน Vercel เพื่อใช้ Groq Free`)})}
function passCore(){const s=coreSession,c=s.cards[s.idx],rep=s.repeats[c.word]||0;if(rep<3||!s.understood.has(c.word))return;if(!state.known.includes(c.word))state.known.push(c.word);state.weak=state.weak.filter(x=>x!==c.word);s.idx++;if(s.idx>=s.cards.length){state.core3000Plan.mastered=Math.min(3000,(Number(state.core3000Plan.mastered)||0)+s.cards.length);state.core3000Plan.lastCompletedAt=new Date().toISOString();s.done=true}s.idx=Math.min(s.idx,s.cards.length-1);saveLocal();render()}
function weakCore(){const c=coreSession.cards[coreSession.idx];if(!state.weak.includes(c.word))state.weak.push(c.word);coreSession.idx=(coreSession.idx+1)%coreSession.cards.length;saveLocal();render()}
function snap(){const o={};for(const k of [KEY,COMPLETE_KEY,PATH_KEY]){const v=localStorage.getItem(k);if(v!==null){try{o[k]=JSON.parse(v)}catch{o[k]=v}}}return o}
function applySnap(o){for(const k of [KEY,COMPLETE_KEY,PATH_KEY])localStorage.removeItem(k);for(const [k,v] of Object.entries(o||{}))if([KEY,COMPLETE_KEY,PATH_KEY].includes(k))localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));state=loadState();path=loadPath()}
async function api(url='/api/account',opts={}){const r=await fetch(url,{cache:'no-store',credentials:'same-origin',...opts});const d=await r.json().catch(()=>({}));return{r,d}}
async function accountBoot(){try{const {r,d}=await api();if(!r.ok||!d.dbConfigured){setBadge('LOCAL PREVIEW');return}const temp=new URLSearchParams(location.search).get('accountTest')==='1';if(d.databaseMode==='temporary'&&!temp){setBadge('LOCAL MODE');return}account.enabled=true;account.status=d;setBadge(d.databaseMode==='temporary'?'TEMP DATABASE':'ACCOUNT');if(!d.authenticated){route='login';render();return}document.querySelector('#userChip').textContent=`${d.user.displayName} · ${d.user.role}`;document.querySelector('#userChip').classList.remove('hidden');document.querySelector('#logoutBtn').classList.remove('hidden');if(d.user.role==='admin')document.querySelector('#adminBtn').classList.remove('hidden');const marker=`v34hydrated:${d.user.id}`;if(!sessionStorage.getItem(marker)){const p=await api('/api/state');if(p.r.ok)applySnap(p.d.state||{});sessionStorage.setItem(marker,'1')}account.last=JSON.stringify(snap());account.timer=setInterval(()=>{const now=JSON.stringify(snap());if(now!==account.last)pushState()},1600);render()}catch{setBadge('LOCAL PREVIEW')}}
async function pushState(){if(!account.enabled||!account.status?.authenticated)return;const text=JSON.stringify(snap());if(text===account.last)return;account.last=text;try{await api('/api/state',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({state:JSON.parse(text)})})}catch{}}
function scheduleSync(){if(account.enabled&&account.status?.authenticated){clearTimeout(scheduleSync.t);scheduleSync.t=setTimeout(pushState,900)}}
async function accountSubmit(action){const e=document.querySelector('#aError');e.textContent='กำลังดำเนินการ...';const legacy=action==='register'?snap():null;try{const {r,d}=await api('/api/account',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,username:document.querySelector('#aUser').value.trim(),password:document.querySelector('#aPass').value,displayName:document.querySelector('#aName')?.value.trim()||document.querySelector('#aUser').value.trim()})});if(!r.ok){e.textContent=({invalid_credentials:'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง',invalid_username:'Username ไม่ถูกต้อง',invalid_password:'Password ต้องมีอย่างน้อย 8 ตัว',username_taken:'Username นี้ถูกใช้แล้ว',registration_closed:'ปิดการสมัครแล้ว'}[d.error]||'ดำเนินการไม่สำเร็จ');return}if(action==='register'&&legacy)await api('/api/state',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({state:legacy})});location.reload()}catch{e.textContent='เชื่อมต่อระบบบัญชีไม่ได้'}}
async function logout(){await pushState();try{await api('/api/account',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'logout'})})}catch{}for(const k of [KEY,COMPLETE_KEY,PATH_KEY])localStorage.removeItem(k);sessionStorage.clear();location.reload()}
async function loadAdmin(){if(!account.status?.authenticated||account.status.user.role!=='admin'){navTo('home');return}const body=document.querySelector('#adminBody');try{const {r,d}=await api('/api/account',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'list-users'})});if(!r.ok)throw 0;body.innerHTML=`<div class="admin-list">${d.users.map(u=>`<div class="admin-row"><div><b>${esc(u.display_name)}</b><div class="muted">@${esc(u.username)} · ${esc(u.role)}</div></div>${u.role==='learner'?`<div class="row"><button class="secondary" data-pass-user="${u.id}" data-name="${esc(u.username)}">ตั้งรหัสใหม่</button><button class="secondary danger" data-reset-user="${u.id}" data-name="${esc(u.username)}">รีเซ็ตการเรียน</button></div>`:''}</div>`).join('')}</div>${d.users.length<d.maxUsers?`<div class="admin-create"><input class="field" id="newDisplay" placeholder="ชื่อผู้เรียน"><input class="field" id="newUser" placeholder="Username"><input class="field" id="newPass" type="password" placeholder="Password ≥ 8"><button class="primary" id="createLearner">+ สร้าง</button></div><div class="error" id="adminError"></div>`:''}`;body.querySelector('#createLearner')?.addEventListener('click',createLearner);body.querySelectorAll('[data-pass-user]').forEach(b=>b.onclick=()=>resetPassword(b.dataset.passUser,b.dataset.name));body.querySelectorAll('[data-reset-user]').forEach(b=>b.onclick=()=>resetLearner(b.dataset.resetUser,b.dataset.name))}catch{body.innerHTML='<p class="error">โหลดรายชื่อผู้เรียนไม่ได้</p>'}}
async function createLearner(){const e=document.querySelector('#adminError');e.textContent='กำลังสร้าง...';const {r,d}=await api('/api/account',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'create-user',displayName:document.querySelector('#newDisplay').value.trim(),username:document.querySelector('#newUser').value.trim(),password:document.querySelector('#newPass').value})});e.textContent=r.ok?'สร้างแล้ว':'สร้างไม่สำเร็จ: '+(d.error||'error');if(r.ok)loadAdmin()}
async function resetPassword(id,name){const p=prompt(`ตั้ง Password ใหม่ให้ ${name} (อย่างน้อย 8 ตัว)`);if(p===null)return;if(p.length<8){alert('Password ต้องมีอย่างน้อย 8 ตัว');return}const p2=prompt('พิมพ์ Password ใหม่ซ้ำ');if(p2!==p){alert('Password ไม่ตรงกัน');return}const {r,d}=await api('/api/account',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'reset-password',userId:id,password:p})});alert(r.ok?'ตั้งรหัสใหม่แล้ว':'ไม่สำเร็จ: '+(d.error||'error'))}
async function resetLearner(id,name){if(!confirm(`รีเซ็ตความคืบหน้าของ ${name} เป็นศูนย์หรือไม่?`))return;const {r,d}=await api('/api/account',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'reset-user',userId:id})});alert(r.ok?'รีเซ็ตแล้ว':'ไม่สำเร็จ: '+(d.error||'error'));if(r.ok)loadAdmin()}
document.querySelector('#adminBtn').onclick=()=>{route='admin';render()};document.querySelector('#logoutBtn').onclick=logout;window.addEventListener('pagehide',()=>pushState());
render();accountBoot();
})();
</script>
</body></html>
