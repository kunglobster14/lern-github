<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Coach V2 Test</title><style>
:root{--bg:#07111f;--panel:#11233d;--line:#28405f;--text:#fff;--muted:#9fb0c5;--accent:#6d28d9}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#050b14,#07111f 35%,#0a1729);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:880px;margin:auto;padding:18px 14px 36px}h1{margin:0 0 6px}.muted{color:var(--muted)}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.badge{border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px}.scenarios{display:flex;gap:8px;overflow:auto;margin:14px 0}.scenarios button,.btn{border:1px solid var(--line);background:#142943;color:#fff;border-radius:14px;padding:11px 14px;cursor:pointer}.scenarios button.active{outline:2px solid #8b5cf6}.panel{background:rgba(17,35,61,.95);border:1px solid var(--line);border-radius:22px;padding:18px}.chat{display:flex;flex-direction:column;gap:12px;min-height:360px;max-height:58vh;overflow:auto;padding:4px}.bubble{max-width:82%;background:#152a46;border:1px solid var(--line);padding:13px 15px;border-radius:18px;line-height:1.45}.bubble.user{align-self:flex-end;background:linear-gradient(135deg,#6d28d9,#4f46e5)}.bubble small{display:block;color:#aab7c8;margin-top:7px}.meta{font-size:11px;color:#7dd3fc;margin-top:6px}.speak{margin-top:8px;border:1px solid var(--line);background:#0b1a2d;color:#fff;border-radius:10px;padding:7px 10px;cursor:pointer}.composer{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin-top:14px}.composer input{min-width:0;background:#09182b;border:1px solid var(--line);border-radius:14px;color:#fff;padding:13px}.send{background:linear-gradient(135deg,#7c3aed,#4f46e5);border:0;color:#fff;border-radius:14px;padding:0 18px;font-weight:700}.mic{font-size:20px;min-width:52px}.hint{font-size:12px;color:var(--muted);margin-top:8px}.error{color:#fca5a5}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:560px){.bubble{max-width:92%}.wrap{padding:12px 10px}.composer{grid-template-columns:auto 1fr auto}.send{padding:0 14px}}
</style></head><body><div class="wrap"><div class="top"><div><div class="muted">MY ENGLISH · TEST ONLY</div><h1>English Coach V2</h1></div><span class="badge" id="status">READY</span></div><p class="muted">ทดสอบคุณภาพ AI + ไมค์ + เสียง โดยไม่รอ Vercel build quota</p><div class="scenarios" id="scenarios"></div><section class="panel"><div class="chat" id="chat"></div><form class="composer" id="form"><button class="btn mic" type="button" id="mic">🎤</button><input id="input" autocomplete="off" placeholder="พิมพ์อังกฤษหรือไทยก็ได้..."><button class="send">ส่ง</button></form><div class="hint" id="hint">กด 🎤 แล้วพูดอังกฤษ → ตรวจข้อความ → กดส่ง</div><div class="row"><button class="btn" id="clear" type="button">ล้างบทสนทนา</button><button class="btn" id="sample" type="button">ใส่ประโยคทดสอบ</button></div></section></div><script>
(()=>{const PROXY='https://kxdzlbyiowspghotzjvu.supabase.co/functions/v1/english-coach-test-proxy';const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4ZHpsYnlpb3dzcGdob3R6anZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxODcxNjEsImV4cCI6MjEwMzc2MzE2MX0.t6u85fzw5R36hBIw1WN60pEgKvBWu2fJH8-DliJmiQA';const S={daily:'🌤️ ชีวิตประจำวัน',work:'💼 ที่ทำงาน',travel:'✈️ เดินทาง',restaurant:'🍽️ ร้านอาหาร'};let scenario='daily',history=[{role:'ai',text:'Hello! I am your English coach. Tell me one short sentence and I will help you improve it.',thai:'ลองพิมพ์หรือพูดประโยคอังกฤษสั้น ๆ แล้วฉันจะช่วยแก้ให้'}],busy=false,rec=null,listening=false;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}function render(){const sc=$('#scenarios');sc.innerHTML=Object.entries(S).map(([k,v])=>`<button data-s="${k}" class="${k===scenario?'active':''}">${v}</button>`).join('');sc.querySelectorAll('button').forEach(b=>b.onclick=()=>{scenario=b.dataset.s;render()});$('#chat').innerHTML=history.map((m,i)=>`<div class="bubble ${m.role==='user'?'user':''}">${esc(m.text)}${m.thai?`<small>${esc(m.thai)}</small>`:''}${m.role==='ai'?`<button class="speak" data-i="${i}">🔊 ฟังคำตอบ</button>${m.source?`<div class="meta">${esc(m.source)}</div>`:''}`:''}</div>`).join('');$('#chat').querySelectorAll('.speak').forEach(b=>b.onclick=()=>speak(history[Number(b.dataset.i)].text));$('#chat').scrollTop=$('#chat').scrollHeight;$('#status').textContent=busy?'กำลังตอบ...':'READY'}async function send(text){if(busy||!text.trim())return;history.push({role:'user',text:text.trim()});busy=true;render();try{const r=await fetch(PROXY,{method:'POST',headers:{'content-type':'application/json','apikey':ANON,'authorization':'Bearer '+ANON},body:JSON.stringify({message:text.trim(),scenario,name:'Kung',history:history.slice(-10)})});const d=await r.json();if(!r.ok)throw new Error(d?.message||d?.error||'request failed');history.push({role:'ai',text:d.text||'No reply',thai:d.thai||'',source:d.source||'unknown'});if(/speak|listen|pronunciation|say it|read it/i.test(text))speak(d.text||'')}catch(e){history.push({role:'ai',text:'Test server error',thai:String(e.message||e),source:'error'})}busy=false;render()}$('#form').onsubmit=e=>{e.preventDefault();const v=$('#input').value;$('#input').value='';send(v)};$('#clear').onclick=()=>{history=[{role:'ai',text:'Hello! I am your English coach. Tell me one short sentence and I will help you improve it.',thai:'เริ่มใหม่ได้เลย'}];render()};$('#sample').onclick=()=>{$('#input').value="I'm working today and so tired";$('#input').focus()};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;$('#mic').onclick=()=>{if(!SR){alert('เบราว์เซอร์นี้ไม่รองรับ Speech Recognition กรุณาใช้ Chrome/Edge หรือไมค์ของคีย์บอร์ด');return}if(listening){try{rec.stop()}catch{}return}rec=new SR();rec.lang='en-US';rec.interimResults=true;rec.continuous=false;let final='';rec.onstart=()=>{listening=true;$('#mic').textContent='⏹️';$('#hint').textContent='กำลังฟัง...'};rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t;else interim+=t}$('#input').value=(final||interim).trim()};rec.onend=()=>{listening=false;$('#mic').textContent='🎤';$('#hint').textContent='ตรวจข้อความแล้วกดส่งได้เลย'};rec.onerror=e=>{$('#hint').textContent='ไมค์: '+e.error;listening=false;$('#mic').textContent='🎤'};try{rec.start()}catch{}};render()})();
</script></body></html>
