<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="My English Coach - ฝึกภาษาอังกฤษบนมือถือพร้อม AI Coach">
  <link rel="manifest" href="manifest.webmanifest">
  <title>My English Coach</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark">M</div>
        <div><div class="eyebrow">MY ENGLISH</div><div class="brand-title">English Coach</div></div>
      </div>
      <button id="profileBtn" class="icon-btn profile-btn" type="button" aria-label="โปรไฟล์"><span>👤</span><b id="profileName">ผู้เรียน</b></button>
    </header>

    <main id="app" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="เมนูหลัก">
      <button class="nav-btn active" data-view="home" type="button"><span class="nav-ico">⌂</span><span>หน้าแรก</span></button>
      <button class="nav-btn" data-view="learn" type="button"><span class="nav-ico">Aa</span><span>เรียน</span></button>
      <button class="nav-btn nav-ai" data-view="ai" type="button"><span class="nav-ai-orb">✦</span><span>AI Coach</span></button>
      <button class="nav-btn" data-view="review" type="button"><span class="nav-ico">↻</span><span>ทบทวน</span></button>
      <button class="nav-btn" data-view="progress" type="button"><span class="nav-ico">◫</span><span>สถิติ</span></button>
    </nav>
  </div>

  <dialog id="profileDialog">
    <form method="dialog" id="profileForm" class="dialog-card">
      <div class="dialog-handle"></div>
      <div class="mini-orb">👋</div>
      <h2>ตั้งชื่อผู้เรียน</h2>
      <p>ชื่อจะใช้เรียกคุณในหน้าเรียนและ AI Coach</p>
      <label for="nameInput">ชื่อเล่น</label>
      <input id="nameInput" maxlength="30" autocomplete="nickname" placeholder="เช่น กุ้ง">
      <div class="dialog-actions"><button value="cancel" class="secondary-btn">ยกเลิก</button><button value="default" class="primary-btn">บันทึก</button></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
