name: Deploy English Learning App to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'english-learning-app/**'
      - '.github/workflows/english-learning-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: english-learning-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload English Learning App
        uses: actions/upload-pages-artifact@v4
        with:
          path: english-learning-app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
