<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Free Talk</title><style>:root{--bg:#07111f;--panel:#11233d;--line:#28405f;--text:#fff;--muted:#9fb0c5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#050b14,#07111f 35%,#0a1729);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:880px;margin:auto;padding:18px 14px 30px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{border:1px solid var(--line);padding:7px 10px;border-radius:999px}.muted{color:var(--muted)}h1{margin:2px 0}.panel{margin-top:16px;background:rgba(17,35,61,.96);border:1px solid var(--line);border-radius:22px;padding:18px}.voicebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;background:#09182b;border:1px solid var(--line);border-radius:16px;margin-bottom:14px}.start,.btn{border:1px solid var(--line);border-radius:14px;padding:12px 16px;background:#142943;color:#fff;cursor:pointer}.start{border:0;background:linear-gradient(135deg,#7c3aed,#4f46e5);font-weight:800}.start.live{background:linear-gradient(135deg,#b91c1c,#ef4444)}.dot{width:10px;height:10px;border-radius:50%;background:#64748b;display:inline-block;margin-right:6px}.dot.listen{background:#22c55e}.dot.wait{background:#f59e0b}.dot.speak{background:#38bdf8}.chat{display:flex;flex-direction:column;gap:12px;min-height:360px;max-height:62vh;overflow:auto;padding:4px}.bubble{max-width:82%;padding:13px 15px;border:1px solid var(--line);border-radius:18px;background:#152a46;line-height:1.45}.bubble.user{align-self:flex-end;background:linear-gradient(135deg,#6d28d9,#4f46e5)}.bubble small{display:block;color:#aab7c8;margin-top:6px}.correction{margin-top:10px;padding:10px 12px;border-radius:12px;background:#0b2b27;border:1px solid #1f6d5e;color:#d1fae5}.correction b{display:block;margin-bottom:3px}.correction em{display:block;color:#99f6e4;font-style:normal}.speakBtn{margin-top:8px;background:#0b1a2d;border:1px solid var(--line);color:#fff;border-radius:10px;padding:7px 10px;cursor:pointer}.composer{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:14px}.composer input{min-width:0;background:#09182b;border:1px solid var(--line);color:#fff;border-radius:14px;padding:13px}.hint,.live{font-size:13px;color:var(--muted);margin-top:8px;min-height:20px}@media(max-width:560px){.bubble{max-width:92%}.wrap{padding:12px 10px}}</style></head><body><div class="wrap"><div class="top"><div><div class="muted">MY ENGLISH · FREE TALK</div><h1>คุยอังกฤษแบบเพื่อน</h1></div><span class="badge" id="status">READY</span></div><p class="muted">คุยอะไรก็ได้เหมือนนั่งคุยกันสบาย ๆ · ถ้าประโยคผิดชัด ระบบจะแนะนำรูปที่ธรรมชาติกว่าโดยไม่ขัดจังหวะ</p><section class="panel"><div class="voicebar"><button id="hands" class="start">🎙️ เริ่มคุย</button><div><span id="dot" class="dot"></span><span id="voiceState">พร้อม</span></div><button id="mute" class="btn" type="button">🔊 เสียง AI: เปิด</button></div><div id="chat" class="chat"></div><div class="composer"><button id="mic" class="btn" type="button">🎤 พูด 1 ครั้ง</button><input id="input" autocomplete="off" readonly placeholder="คำพูดของคุณจะแสดงตรงนี้และส่งเอง"></div><div id="liveText" class="live"></div><div class="hint">🎙️ เริ่มคุย = สนทนาต่อเนื่อง · 🎤 พูด 1 ครั้ง = ส่งเองหนึ่งรอบ · 💡 แสดงเฉพาะคำแก้ที่จำเป็น</div></section></div><script>(()=>{const PROXY='https://kxdzlbyiowspghotzjvu.supabase.co/functions/v1/english-coach-test-proxy';const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4ZHpsYnlpb3dzcGdob3R6anZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxODcxNjEsImV4cCI6MjEwMzc2MzE2MX0.t6u85fzw5R36hBIw1WN60pEgKvBWu2fJH8-DliJmiQA';const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let history=[{role:'ai',text:'Hey! I’m here. What’s up?',thai:'เฮ้ ฉันอยู่นี่ เป็นไงบ้าง?'}],hands=false,voiceOn=true,busy=false,speaking=false,listening=false,rec=null,cycle=0;function setState(t,k=''){$('#voiceState').textContent=t;$('#dot').className='dot '+k}function render(){$('#status').textContent=busy?'AI THINKING':hands?'HANDS-FREE':'READY';$('#hands').classList.toggle('live',hands);$('#hands').textContent=hands?'⏹️ หยุดคุย':'🎙️ เริ่มคุย';$('#mute').textContent=voiceOn?'🔊 เสียง AI: เปิด':'🔇 เสียง AI: ปิด';$('#chat').innerHTML=history.map((m,i)=>`<div class="bubble ${m.role==='user'?'user':''}">${esc(m.text)}${m.thai?`<small>${esc(m.thai)}</small>`:''}${m.role==='ai'&&m.correction?`<div class="correction"><b>💡 พูดแบบธรรมชาติกว่า</b>${esc(m.correction)}${m.correctionThai?`<em>${esc(m.correctionThai)}</em>`:''}</div>`:''}${m.role==='ai'?`<button class="speakBtn" data-i="${i}">🔊 ฟังซ้ำ</button>`:''}</div>`).join('');$('#chat').querySelectorAll('.speakBtn').forEach(b=>b.onclick=()=>speak(history[+b.dataset.i].text,false));$('#chat').scrollTop=$('#chat').scrollHeight}function stopRec(){try{rec?.abort()}catch{}listening=false;rec=null}function speak(text,resume){return new Promise(resolve=>{stopRec();if(!voiceOn||!('speechSynthesis'in window)){resolve();if(resume&&hands)setTimeout(()=>listen(true),300);return}try{speechSynthesis.cancel()}catch{}const u=new SpeechSynthesisUtterance(String(text||''));u.lang='en-US';u.rate=.9;speaking=true;setState('AI กำลังพูด...','speak');let done=false;const finish=()=>{if(done)return;done=true;clearTimeout(watch);speaking=false;resolve();if(resume&&hands)setTimeout(()=>listen(true),350);else if(!hands)setState('พร้อม')};u.onend=finish;u.onerror=finish;const watch=setTimeout(()=>{try{speechSynthesis.cancel()}catch{}finish()},Math.max(4500,Math.min(12000,String(text).length*80)));speechSynthesis.speak(u)})}async function send(text,resume){text=String(text||'').trim();if(!text||busy)return;busy=true;history.push({role:'user',text});$('#input').value='';$('#liveText').textContent='กำลังส่ง: '+text;setState('AI กำลังคิด...','wait');render();try{const r=await fetch(PROXY,{method:'POST',headers:{'content-type':'application/json','apikey':ANON,'authorization':'Bearer '+ANON},body:JSON.stringify({message:text,name:'Kung',history:history.slice(-12),mode:'free-talk'})});const d=await r.json();if(!r.ok)throw new Error(d?.error||'request failed');history.push({role:'ai',text:d.text||'I’m here.',thai:d.thai||'',correction:d.correction||'',correctionThai:d.correctionThai||''});busy=false;$('#liveText').textContent='';render();await speak(d.text||'I’m here.',resume&&hands)}catch{busy=false;history.push({role:'ai',text:'I lost the connection for a second. Say that again?',thai:'การเชื่อมต่อสะดุด ลองพูดอีกครั้งได้เลย'});render();await speak(history.at(-1).text,resume&&hands)}}function listen(loop){if(!SR){alert('กรุณาใช้ Chrome หรือ Edge ที่รองรับ Speech Recognition');hands=false;render();return}if(listening||busy||speaking)return;if(loop&&!hands)return;const id=++cycle;const r=new SR();rec=r;r.lang='en-US';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;let heard='',sent=false,timer=null;const finalize=()=>{if(sent||id!==cycle)return;const text=(heard||$('#input').value||'').trim();if(!text)return;sent=true;clearTimeout(timer);try{r.abort()}catch{}listening=false;rec=null;send(text,loop)};r.onstart=()=>{if(id!==cycle)return;listening=true;setState('กำลังฟังคุณ...','listen');$('#liveText').textContent='พูดได้เลย...'};r.onresult=e=>{if(id!==cycle)return;let text='',final=false;for(let i=0;i<e.results.length;i++){const t=e.results[i][0].transcript.trim();if(t)text+=(text?' ':'')+t;if(e.results[i].isFinal)final=true}if(text)heard=text;$('#input').value=heard;$('#liveText').textContent=heard?'ได้ยิน: '+heard:'กำลังฟัง...';clearTimeout(timer);if(heard)timer=setTimeout(finalize,final?250:1000)};r.onend=()=>{if(id!==cycle)return;clearTimeout(timer);listening=false;rec=null;if(sent)return;if(heard){finalize();return}if(loop&&hands&&!busy&&!speaking)setTimeout(()=>listen(true),500);else if(!hands)setState('พร้อม')};r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){hands=false;setState('ไมค์ไม่ได้รับอนุญาต');render()}};try{r.start()}catch{setState('เปิดไมค์ไม่ได้')}}$('#hands').onclick=()=>{if(hands){hands=false;cycle++;stopRec();try{speechSynthesis.cancel()}catch{}speaking=false;setState('หยุดแล้ว');render();return}hands=true;render();listen(true)};$('#mic').onclick=()=>listen(false);$('#mute').onclick=()=>{voiceOn=!voiceOn;if(!voiceOn)try{speechSynthesis.cancel()}catch{}render()};render()})();</script></body></html>
