name: Oxford 3000 validation

on:
  push:
    branches: [main]
    paths:
      - 'english-learning-app/**'
      - '.github/workflows/oxford3000-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: english-learning-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Oxford 3000 data and JavaScript
        run: node scripts/test-oxford3000.mjs
      - name: Audit 210 lesson uniqueness and Quick Check answers
        run: node scripts/test-course-v57.mjs
      - name: Validate Thai lesson terminology
        run: node scripts/test-terminology-v58.mjs
      - name: Audit v59 sentence game pools
        run: node scripts/test-v59.mjs
      - name: Audit v60 curriculum variety
        run: node scripts/test-v60.mjs
      - name: Audit v62 institute curriculum and hard game pools
        run: node scripts/test-v62.mjs
      - name: Audit v63 answers across all 210 lessons
        run: node scripts/test-answer-integrity-v63.mjs
      - name: Audit v64 production, speaking, and lesson variety
        run: node scripts/test-v64.mjs
      - name: Audit v65 separated mastery, timed games, and mic answers
        run: node scripts/test-v65.mjs
      - name: Audit v67 unique lesson flows, quiz, and Final Voice hints
        run: node scripts/test-v67.mjs
      - name: Audit v68 teach-before-test, Thai teacher clips, and no prompt reuse
        run: node scripts/test-v68.mjs
      - name: Audit v69 Thai cartoon teacher across all lessons
        run: node scripts/test-v69.mjs
      - name: Audit v70 Thai-first localization and redesigned cartoon teacher
        run: node scripts/test-v70.mjs
      - name: Audit v71 natural voices and strict teach-test separation
        run: node scripts/test-v71.mjs
      - name: Audit V71 semantic lesson quality and connected dialogue
        run: node scripts/test-v71-quality.mjs
      - name: Audit V72 curriculum-first A1-B2 progression
        run: node scripts/test-v72.mjs
      - name: Audit V72 teacher-led learning experience
        run: node scripts/test-v72-experience.mjs
      - name: Audit V73 institute curriculum, four skills, and core 500
        run: node scripts/test-v73.mjs
      - name: Audit V75 varied end-of-lesson assessments across all 210 lessons
        run: node scripts/test-v75-assessment.mjs
      - name: Audit V75 progressive learning growth and role-specific lessons
        run: node scripts/test-v75-growth.mjs
      - name: Audit V76 grammar-first TOEIC curriculum and Parts 1-7
        run: node scripts/test-v76-grammar-toeic.mjs
      - name: Audit V76 TOEIC assessment variety across all 210 lessons
        run: node scripts/test-v76-toeic-variety.mjs
      - name: Audit V77 detailed Grammar Academy lessons and remove legacy home menus
        run: node scripts/test-v77-detailed-lessons.mjs
      - name: Audit V78 curriculum menu and Oxford 3000 serial novel
        run: node scripts/test-v78-course-novel.mjs
      - name: Audit V79 lesson character narrators and gender-mapped voices
        run: node scripts/test-v79-narrators.mjs
      - name: Audit V80 simplified stories and non-repeating vocabulary games
        run: node scripts/test-v80-simplified.mjs
      - name: Audit V83 story opening stability and iOS narration
        run: node scripts/test-v83-story-stability.mjs
      - name: Audit V84 immersive stories, contrast, slower narration, and game preservation
        run: node scripts/test-v84-immersive-reader.mjs
      - name: Audit V85 classic games and story vocabulary integrity
        run: node scripts/test-v85-classic-games-stories.mjs
      - name: Audit V85 reliable sentence translation and four slower audio speeds
        run: node scripts/test-v85-story-sentence-controls.mjs
