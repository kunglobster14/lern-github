<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Coach Friend Voice 2.1</title><style>
:root{--bg:#07111f;--panel:#11233d;--line:#28405f;--text:#fff;--muted:#9fb0c5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#050b14,#07111f 35%,#0a1729);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px 14px 36px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{border:1px solid var(--line);padding:7px 10px;border-radius:999px}.muted{color:var(--muted)}h1{margin:2px 0}.scenarios{display:flex;gap:8px;overflow:auto;margin:14px 0}.scenarios button,.btn{border:1px solid var(--line);background:#142943;color:#fff;border-radius:14px;padding:11px 14px;cursor:pointer}.scenarios .active{outline:2px solid #8b5cf6}.panel{background:rgba(17,35,61,.96);border:1px solid var(--line);border-radius:22px;padding:18px}.voicebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;background:#09182b;border:1px solid var(--line);border-radius:16px;margin-bottom:14px}.start{border:0;border-radius:14px;padding:12px 16px;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;font-weight:800;cursor:pointer}.start.live{background:linear-gradient(135deg,#b91c1c,#ef4444)}.dot{width:10px;height:10px;border-radius:50%;background:#64748b;display:inline-block;margin-right:6px}.dot.listen{background:#22c55e;box-shadow:0 0 12px #22c55e}.dot.wait{background:#f59e0b;box-shadow:0 0 12px #f59e0b}.dot.speak{background:#38bdf8;box-shadow:0 0 12px #38bdf8}.chat{display:flex;flex-direction:column;gap:12px;min-height:360px;max-height:58vh;overflow:auto;padding:4px}.bubble{max-width:82%;padding:13px 15px;border:1px solid var(--line);border-radius:18px;background:#152a46;line-height:1.45}.bubble.user{align-self:flex-end;background:linear-gradient(135deg,#6d28d9,#4f46e5)}.bubble small{display:block;color:#aab7c8;margin-top:6px}.meta{font-size:11px;color:#7dd3fc;margin-top:6px}.speakBtn{margin-top:8px;background:#0b1a2d;border:1px solid var(--line);color:#fff;border-radius:10px;padding:7px 10px}.composer{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin-top:14px}.composer input{min-width:0;background:#09182b;border:1px solid var(--line);color:#fff;border-radius:14px;padding:13px}.send{border:0;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;padding:0 18px;font-weight:700}.mic{font-size:20px;min-width:52px}.hint{font-size:12px;color:var(--muted);margin-top:8px}.transcript{font-size:13px;color:#cbd5e1;margin-top:8px;min-height:20px}@media(max-width:560px){.bubble{max-width:92%}.wrap{padding:12px 10px}}
</style></head><body><div class="wrap"><div class="top"><div><div class="muted">MY ENGLISH · VOICE TEST 2.1</div><h1>English Coach · Friend Mode</h1></div><span class="badge" id="status">READY</span></div><p class="muted">พูดจบ → ส่งเอง → AI ตอบด้วยเสียง → เปิดไมค์รอรอบต่อไป</p><div class="scenarios" id="scenarios"></div><section class="panel"><div class="voicebar"><button id="hands" class="start">🎙️ เริ่มคุยอัตโนมัติ</button><div><span id="dot" class="dot"></span><span id="voiceState">พร้อม</span></div><button id="mute" class="btn" type="button">🔊 เสียง AI: เปิด</button></div><div id="chat" class="chat"></div><form id="form" class="composer"><button id="mic" class="btn mic" type="button">🎤</button><input id="input" autocomplete="off" placeholder="พูดหรือพิมพ์อังกฤษได้..."><button class="send">ส่ง</button></form><div id="liveText" class="transcript"></div><div id="hint" class="hint">กดเริ่มคุยอัตโนมัติครั้งเดียว แล้วพูดตามปกติ</div></section></div><script>
(()=>{
const PROXY='https://kxdzlbyiowspghotzjvu.supabase.co/functions/v1/english-coach-test-proxy';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4ZHpsYnlpb3dzcGdob3R6anZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxODcxNjEsImV4cCI6MjEwMzc2MzE2MX0.t6u85fzw5R36hBIw1WN60pEgKvBWu2fJH8-DliJmiQA';
const S={daily:'🌤️ ชีวิตประจำวัน',work:'💼 ที่ทำงาน',travel:'✈️ เดินทาง',restaurant:'🍽️ ร้านอาหาร'};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let scenario='daily',history=[{role:'ai',text:'Hi! Let’s chat like friends. How was your day today?',thai:'คุยกันสบาย ๆ เหมือนเพื่อนนะ วันนี้เป็นอย่างไรบ้าง?',source:'friend-starter'}];
let handsFree=false,busy=false,speaking=false,listening=false,voiceOn=true,rec=null,stopReason='',listenGeneration=0;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setState(t,k=''){ $('#voiceState').textContent=t;$('#dot').className='dot '+k; }
function buttons(){ $('#hands').classList.toggle('live',handsFree);$('#hands').textContent=handsFree?'⏹️ หยุดสนทนา':'🎙️ เริ่มคุยอัตโนมัติ';$('#mute').textContent=voiceOn?'🔊 เสียง AI: เปิด':'🔇 เสียง AI: ปิด';$('#status').textContent=busy?'AI THINKING':handsFree?'HANDS-FREE':'READY'; }
function render(){const sc=$('#scenarios');sc.innerHTML=Object.entries(S).map(([k,v])=>`<button class="${k===scenario?'active':''}" data-s="${k}">${v}</button>`).join('');sc.querySelectorAll('button').forEach(b=>b.onclick=()=>{scenario=b.dataset.s;render()});$('#chat').innerHTML=history.map((m,i)=>`<div class="bubble ${m.role==='user'?'user':''}">${esc(m.text)}${m.thai?`<small>${esc(m.thai)}</small>`:''}${m.role==='ai'?`<button class="speakBtn" data-i="${i}">🔊 ฟังซ้ำ</button>${m.source?`<div class="meta">${esc(m.source)}</div>`:''}`:''}</div>`).join('');$('#chat').querySelectorAll('.speakBtn').forEach(b=>b.onclick=()=>speak(history[+b.dataset.i].text,false));$('#chat').scrollTop=$('#chat').scrollHeight;buttons()}
function speak(text,resume){return new Promise(resolve=>{if(!voiceOn||!('speechSynthesis'in window)){resolve();if(resume&&handsFree)setTimeout(()=>startListen(true),300);return}if(listening){stopReason='ai-speaking';try{rec.stop()}catch{}}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.88;speaking=true;setState('AI กำลังพูด...','speak');const done=()=>{speaking=false;resolve();if(resume&&handsFree)setTimeout(()=>startListen(true),450)};u.onend=done;u.onerror=done;speechSynthesis.speak(u)})}
async function send(text,fromVoice=false){text=String(text||'').trim();if(!text||busy)return;history.push({role:'user',text});busy=true;setState('AI กำลังคิด...','wait');$('#liveText').textContent='';render();try{const r=await fetch(PROXY,{method:'POST',headers:{'content-type':'application/json','apikey':ANON,'authorization':'Bearer '+ANON},body:JSON.stringify({message:text,scenario,name:'Kung',history:history.slice(-12),mode:'friend'})});const d=await r.json();if(!r.ok)throw new Error(d?.message||d?.error||'request failed');history.push({role:'ai',text:d.text||'Tell me more.',thai:d.thai||'',source:d.source||'unknown'});busy=false;render();if(handsFree||fromVoice)await speak(d.text||'Tell me more.',handsFree);else setState('พร้อม')}catch(e){busy=false;history.push({role:'ai',text:'I lost the connection for a moment. Can you say that again?',thai:'การเชื่อมต่อสะดุด ลองพูดอีกครั้งได้เลย',source:'network-fallback'});render();if(handsFree)await speak(history.at(-1).text,true)}}
function startListen(autoSend){if(!SR){alert('กรุณาใช้ Chrome/Edge ที่รองรับ Speech Recognition');handsFree=false;buttons();return}if(listening||busy||speaking)return;if(autoSend&&!handsFree)return;const gen=++listenGeneration;stopReason='';rec=new SR();rec.lang='en-US';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;let finalText='',latestText='',stopTimer=null;
rec.onstart=()=>{if(gen!==listenGeneration)return;listening=true;$('#mic').textContent='⏹️';setState('กำลังฟังคุณ...','listen');$('#liveText').textContent='พูดได้เลย...'};
rec.onresult=e=>{if(gen!==listenGeneration)return;let interim='',finalChunk='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript.trim();if(e.results[i].isFinal)finalChunk+=(finalChunk?' ':'')+t;else interim+=(interim?' ':'')+t}if(finalChunk)finalText+=(finalText?' ':'')+finalChunk;latestText=(finalText||interim).trim();if(!latestText&&interim)latestText=interim.trim();$('#input').value=latestText;$('#liveText').textContent=latestText?'ได้ยิน: '+latestText:'กำลังฟัง...';if(finalChunk){clearTimeout(stopTimer);stopTimer=setTimeout(()=>{if(listening&&gen===listenGeneration){stopReason='final-ready';try{rec.stop()}catch{}}},250)}};
rec.onerror=e=>{if(gen!==listenGeneration)return;if(e.error==='not-allowed'||e.error==='service-not-allowed'){handsFree=false;setState('ไมค์ไม่ได้รับอนุญาต');buttons()}else if(e.error!=='no-speech'&&e.error!=='aborted')setState('ไมค์: '+e.error)};
rec.onend=()=>{if(gen!==listenGeneration)return;clearTimeout(stopTimer);listening=false;$('#mic').textContent='🎤';const heard=(finalText||latestText||$('#input').value||'').trim();const reason=stopReason;stopReason='';if(autoSend&&handsFree&&heard&&reason!=='ai-speaking'&&reason!=='user-stop'){ $('#input').value='';$('#liveText').textContent='กำลังส่ง: '+heard;send(heard,true);return }if(handsFree&&!busy&&!speaking&&reason!=='user-stop')setTimeout(()=>startListen(true),550);else if(!handsFree)setState('พร้อม')};
try{rec.start()}catch(e){listening=false;setState('เปิดไมค์ไม่ได้')}}
function toggleHands(){if(handsFree){handsFree=false;stopReason='user-stop';listenGeneration++;try{rec?.stop()}catch{};try{speechSynthesis.cancel()}catch{};listening=false;speaking=false;setState('หยุดแล้ว');$('#liveText').textContent='';buttons();return}if(!SR){alert('กรุณาใช้ Chrome/Edge ที่รองรับ Speech Recognition');return}handsFree=true;buttons();const last=history.at(-1);if(last?.role==='ai')speak(last.text,true);else startListen(true)}
$('#hands').onclick=toggleHands;$('#mute').onclick=()=>{voiceOn=!voiceOn;if(!voiceOn)try{speechSynthesis.cancel()}catch{};buttons()};$('#form').onsubmit=e=>{e.preventDefault();const t=$('#input').value;$('#input').value='';send(t,false)};$('#mic').onclick=()=>{if(listening){stopReason='manual-mic';try{rec.stop()}catch{};return}startListen(false)};render();
})();
</script></body></html>
